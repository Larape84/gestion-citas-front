
<div class="w-full flex flex-col">

    <div class="py-5 w-full bg-card flex items-center pl-4 gap-2">

        <mat-icon svgIcon="heroicons_outline:square-3-stack-3d" class="icon-size-14 text-gray-800"></mat-icon>
        <div class="flex flex-col ">
            <span class="inline-block text-gray-700 text-3xl font-semibold">Entidades</span>
            <span class="inline-block text-gray-500 text-lg">Modulo para la gestión de entidades</span>
        </div>

    </div>


       <div class="mt-5 w-full p-3">


        <div class="rounded-md border border-gray-300 bg-white flex flex-col ">

            <div class="w-full flex flex-row justify-between py-2 px-2 gap-2">

                <button (click)="crearEntidad(null)" type="button" mat-raised-button color="primary">Crear entidad</button>

                <div class="flex flex-row gap-2">



                    <button (click)="descargarData()" mat-icon-button type="button">
                        <mat-icon class="icon-size-7 text-gray-600">cloud_download</mat-icon>
                    </button>

                    <button (click)="listarEntidad()" mat-icon-button type="button">
                        <mat-icon class="icon-size-7 text-gray-600">settings_backup_restore</mat-icon>
                    </button>

                    <div class="rounded-full h-9 gap-2 flex flex-row items-center justify-between border border-gray-300 px-2 w-72">
                        <mat-icon class="icon-size-5">search</mat-icon>
                        <input (keyup)="filtrar(entidad.value)" #entidad placeholder="Filtrar..." type="text" autocomplete="off" matInput class="text-gray-600 w-full">
                    </div>

                </div>



            </div>


             <div  class=" w-full xl:max-h-128 lg:max-h-100 overflow-y-auto">

                <table  mat-table [dataSource]="dataSource" >





                      <ng-container matColumnDef="editar">
                        <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Nit</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="w-full flex items-center">


                                <button type="button" mat-icon-button [matMenuTriggerFor]="menuRef">

                                     <mat-icon class="text-gray-400 icon-size-8">list</mat-icon>

                                </button>

                                <mat-menu #menuRef="matMenu">
                                      <button mat-menu-item  type="button" (click)="crearEntidad(element)">
                                    <mat-icon class="text-gray-400 icon-size-8">edit</mat-icon>
                                    <span>Editar Entidad</span>
                                </button>

                                <button mat-menu-item  type="button" (click)="crearAgenda(element)">
                                    <mat-icon class="text-gray-400 icon-size-8">assignment</mat-icon>
                                    <span>Crear Agenda</span>
                                </button>


                                </mat-menu>




                            </div>

                        </td>
                      </ng-container>




                      <ng-container matColumnDef="nitEntidad">
                        <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Nit</th>
                        <td mat-cell *matCellDef="let element"> {{element.nitEntidad}} </td>
                      </ng-container>



                    <ng-container matColumnDef="nombre">
                      <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Entidad</th>
                      <td mat-cell *matCellDef="let element">

                        <div class="flex flex-col">

                            <span>
                                {{element.nombre}}
                            </span>


                        </div>


                      </td>
                    </ng-container>



                      <ng-container matColumnDef="direccion">
                        <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Dirección</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="flex flex-col">

                                <span>
                                    {{element.direccion}}
                                </span>


                            </div>

                        </td>
                      </ng-container>


                      <ng-container matColumnDef="telefono">
                        <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Teléfono</th>
                        <td mat-cell *matCellDef="let element">

                            <div class="flex flex-col">

                                <span>
                                    {{element.telefono}}
                                </span>


                            </div>



                        </td>
                      </ng-container>



                      <ng-container matColumnDef="fechaRegistro">
                        <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Fecha de registro</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="flex flex-col">

                                <span>
                                    {{element.fechaRegistro | dataTable : 'date'}}
                                </span>


                            </div>


                        </td>
                      </ng-container>









                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell text-center" colspan="21">
                            <div class="w-full h-40 flex flex-col gap-4 items-center justify-center">

                                <div class="flex items-center content-center justify-center mt-7 gap-3">
                                    <mat-icon svgIcon="heroicons_outline:information-circle"></mat-icon>
                                    <p class="text-5xl font-semibold tracking-tight">
                                        {{ "Aviso" }}
                                    </p>
                                </div>
                                <p class="text-lg mb-8">
                                    {{ "Lo sentimos, no se encontraron datos " }}
                                </p>
                            </div>

                        </td>

                    </tr>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="border-t border-gray-300 sticky -top-0.5 border-b"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                  </table>
            </div>



              <mat-paginator class="border-t border-gray-300 flex items-center h-12 bg-gray-100 rounded-b-md w-full">
            </mat-paginator>





        </div>



    </div>



</div>
